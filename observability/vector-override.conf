[Service]
ExecStartPre=
ExecStartPre=/usr/bin/vector validate --skip-healthchecks /etc/vector/zay.json
ExecStart=
ExecStart=/usr/bin/vector --threads 1 --graceful-shutdown-limit-secs 30 --config /etc/vector/zay.json
ExecReload=
ExecReload=/usr/bin/vector validate --no-environment --skip-healthchecks /etc/vector/zay.json
ExecReload=/bin/kill -HUP $MAINPID
EnvironmentFile=
SupplementaryGroups=docker systemd-journal
AmbientCapabilities=
CapabilityBoundingSet=
UMask=0077
NoNewPrivileges=true
PrivateTmp=true
ProtectHome=true
ProtectSystem=strict
ReadWritePaths=/var/lib/vector
MemoryHigh=384M
MemoryMax=512M
CPUQuota=50%
TasksMax=128
LimitNOFILE=4096
TimeoutStopSec=40
RestartSec=5
